<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GARI Token Prediction</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/technicalindicators@3.0.2/dist/browser.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }
    #chart-container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
      background: #1e293b;
      border-radius: 10px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>GARI Token Live Chart & Prediction</h1>  <!-- TradingView Widget -->  <div class="tradingview-widget-container" style="margin: 20px auto">
    <div id="tradingview_gari"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": 400,
        "symbol": "GARIUSDT",
        "interval": "1H",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "container_id": "tradingview_gari"
      });
    </script>
  </div>  <!-- Simple Prediction Chart (dummy data) -->  <div id="chart-container">
    <canvas id="predictionChart"></canvas>
  </div>  <script>
    // Dummy data for prediction chart (replace with real API/machine learning later)
    const labels = ["Now", "+1h", "+2h", "+3h", "+4h", "+5h"];
    const data = {
      labels: labels,
      datasets: [
        {
          label: "Predicted GARI Price ($)",
          backgroundColor: "#38bdf8",
          borderColor: "#38bdf8",
          data: [0.04, 0.045, 0.043, 0.046, 0.049, 0.051],
          tension: 0.3
        }
      ]
    };

    const config = {
      type: 'line',
      data: data,
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: 'white' } }
        },
        scales: {
          x: { ticks: { color: 'white' } },
          y: { ticks: { color: 'white' } }
        }
      }
    };

    new Chart(document.getElementById('predictionChart'), config);
  </script></body>
</html>
